<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewal Radar</title>
<style>
  :root { --ink:#14161c; --muted:#5d6472; --line:#e3e6ec; --brand:#4a4cf0; --bg:#f6f7fb; --red:#c0262d; --amber:#b86e00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; background:#fff; border-bottom:1px solid var(--line); }
  .logo { font-weight:700; color:var(--brand); }
  header span { color:var(--muted); font-size:14px; margin-right:12px; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 60px; }
  button { font: inherit; cursor:pointer; }
  .btn { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; font-weight:600; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.danger { color:var(--red); }
  .connect { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:20px; }
  .connect h3 { margin:0 0 6px; font-size:15px; }
  .connect p { margin:0 0 10px; color:var(--muted); font-size:14px; }
  .url { display:flex; gap:8px; }
  .url input { flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-family: ui-monospace, Menlo, monospace; font-size:13px; background:#fafbfd; }
  .cards { display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; margin-bottom:20px; }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .stat small { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .stat div { font-size:24px; font-weight:700; margin-top:6px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .bar h2 { margin:0; font-size:18px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  th { background:#fafbfd; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:#fafbff; }
  .pill { display:inline-block; padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600; background:#eef0f6; color:var(--muted); }
  .pill.urgent { background:#fde8e9; color:var(--red); }
  .pill.soon { background:#fff3dc; color:var(--amber); }
  .empty { background:#fff; border:1px dashed var(--line); border-radius:12px; padding:30px; text-align:center; color:var(--muted); }
  dialog { border:0; border-radius:14px; padding:0; width:min(520px, 92vw); box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(20,22,28,.45); }
  form.edit { padding:22px; }
  form.edit h3 { margin:0 0 6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; }
  input, select, textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:26px; }
  .chk input { width:auto; }
  .actions { display:flex; gap:8px; margin-top:18px; }
  .actions .sp { flex:1; }
  .err { color:var(--red); font-size:13px; min-height:18px; margin-top:8px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#14161c; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; display:none; }
</style>
</head>
<body>
<header>
  <div class="logo">Renewal Radar</div>
  <div><span id="who"></span><button class="btn" id="logout">Log out</button></div>
</header>
<main>
  <div class="connect">
    <h3>Connect to Claude</h3>
    <p>In Claude, go to Settings, then Connectors, then Add custom connector. Paste this private link. Do not share it.</p>
    <div class="url"><input id="mcp" readonly><button class="btn" id="copy">Copy</button></div>
  </div>

  <div class="cards">
    <div class="stat"><small>Monthly spend</small><div id="sMonthly">-</div></div>
    <div class="stat"><small>Due in 30 days</small><div id="sDue">-</div></div>
    <div class="stat"><small>Tracked renewals</small><div id="sCount">-</div></div>
  </div>

  <div class="bar">
    <h2>Renewals</h2>
    <div>
      <button class="btn" id="alerts">Send reminder emails now</button>
      <button class="btn primary" id="add">+ Add renewal</button>
    </div>
  </div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <form class="edit" id="form" method="dialog">
    <h3 id="dTitle">Edit renewal</h3>
    <div class="grid">
      <div><label for="vendor">Vendor</label><input id="vendor" required></div>
      <div><label for="plan">Plan</label><input id="plan"></div>
      <div><label for="amount">Amount per cycle</label><input id="amount" type="number" step="0.01" min="0"></div>
      <div><label for="currency">Currency</label><input id="currency" maxlength="8"></div>
      <div><label for="billing_cycle">Billing cycle</label>
        <select id="billing_cycle"><option>monthly</option><option>quarterly</option><option>yearly</option></select></div>
      <div><label for="renewal_date">Renewal date</label><input id="renewal_date" type="date" required></div>
      <div><label for="notice_days">Alert me (days before)</label><input id="notice_days" type="number" min="0" max="365"></div>
      <div class="chk"><input id="auto_renews" type="checkbox"><label for="auto_renews" style="margin:0">Auto-renews</label></div>
    </div>
    <label for="owner">Owner</label><input id="owner">
    <label for="notes">Notes</label><textarea id="notes" rows="3"></textarea>
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="del">Delete</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = { monthly: 1, quarterly: 3, yearly: 12 };
  let rows = [];
  let editingId = null;

  async function api(path, opts = {}) {
    const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
    if (r.status === 401) { location.href = "/"; throw new Error("Not logged in"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Something went wrong");
    return j;
  }
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => (t.style.display = "none"), 2800);
  }
  const daysLeft = (d) => Math.round((new Date(d + "T00:00:00") - new Date(new Date().toDateString())) / 864e5);
  const money = (n, c) => `${c} ${Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 })}`;

  function render() {
    const by = {};
    let due = 0;
    for (const r of rows) {
      by[r.currency] = (by[r.currency] || 0) + r.amount / MONTHS[r.billing_cycle];
      const d = daysLeft(r.renewal_date);
      if (d >= 0 && d <= 30) due++;
    }
    const parts = Object.entries(by).map(([c, v]) => money(v, c));
    $("#sMonthly").textContent = parts.length ? parts.join(" + ") : "-";
    $("#sDue").textContent = rows.length ? due : "-";
    $("#sCount").textContent = rows.length;

    if (!rows.length) {
      $("#list").innerHTML = `<div class="empty">Nothing here yet. Ask Claude: "Add my Notion subscription, $96 a year, renews on 2026-12-20", or click Add renewal.</div>`;
      return;
    }
    const body = rows.map((r) => {
      const d = daysLeft(r.renewal_date);
      let cls = "pill", label = `${d} days`;
      if (d < 0) label = "Passed";
      else if (d === 0) { label = "Today"; cls += " urgent"; }
      else if (r.auto_renews && d <= r.notice_days) cls += " urgent";
      else if (d <= 30) cls += " soon";
      return `<tr class="row" data-id="${r.id}">
        <td><b>${esc(r.vendor)}</b><br><small style="color:#5d6472">${esc(r.plan || "")}</small></td>
        <td>${esc(money(r.amount, r.currency))} <small style="color:#5d6472">/ ${esc(r.billing_cycle)}</small></td>
        <td>${esc(r.renewal_date)}</td>
        <td><span class="${cls}">${esc(label)}</span></td>
        <td>${r.auto_renews ? "Auto" : "Manual"}</td>
        <td>${esc(r.owner || "")}</td></tr>`;
    }).join("");
    $("#list").innerHTML = `<table><thead><tr><th>Vendor</th><th>Cost</th><th>Renews</th><th>In</th><th>Type</th><th>Owner</th></tr></thead><tbody>${body}</tbody></table>`;
    document.querySelectorAll("tr.row").forEach((tr) => (tr.onclick = () => openForm(rows.find((x) => x.id == tr.dataset.id))));
  }

  function openForm(r) {
    editingId = r ? r.id : null;
    $("#dTitle").textContent = r ? "Edit renewal" : "Add renewal";
    $("#del").style.display = r ? "" : "none";
    $("#err").textContent = "";
    const v = r || { vendor: "", plan: "", amount: "", currency: "INR", billing_cycle: "yearly", renewal_date: "", notice_days: 14, auto_renews: true, owner: "", notes: "" };
    for (const k of ["vendor", "plan", "amount", "currency", "billing_cycle", "renewal_date", "notice_days", "owner", "notes"]) $("#" + k).value = v[k] ?? "";
    $("#auto_renews").checked = !!v.auto_renews;
    $("#dlg").showModal();
  }

  async function load() {
    const me = await api("/api/me");
    $("#who").textContent = me.email;
    $("#mcp").value = me.mcp_url;
    rows = (await api("/api/renewals")).renewals;
    render();
    const e = new URLSearchParams(location.search).get("edit");
    if (e) {
      const r = rows.find((x) => x.id == e);
      if (r) openForm(r);
      history.replaceState({}, "", "/app");
    }
  }

  $("#add").onclick = () => openForm(null);
  $("#cancel").onclick = () => $("#dlg").close();
  $("#copy").onclick = async () => { await navigator.clipboard.writeText($("#mcp").value); toast("Link copied"); };
  $("#logout").onclick = async () => { await api("/api/logout", { method: "POST" }); location.href = "/"; };
  $("#alerts").onclick = async () => {
    try {
      const j = await api("/api/send-alerts", { method: "POST" });
      toast(j.note || `Sent ${j.sent} reminder email(s)`);
    } catch (e) { toast(e.message); }
  };
  $("#del").onclick = async () => {
    if (!confirm("Delete this renewal?")) return;
    await api("/api/renewals/" + editingId, { method: "DELETE" });
    $("#dlg").close();
    await load();
  };
  $("#form").onsubmit = async (e) => {
    e.preventDefault();
    const body = {};
    for (const k of ["vendor", "plan", "amount", "currency", "billing_cycle", "renewal_date", "notice_days", "owner", "notes"]) body[k] = $("#" + k).value;
    body.auto_renews = $("#auto_renews").checked;
    if (body.amount === "") body.amount = 0;
    if (body.notice_days === "") body.notice_days = 14;
    try {
      await api(editingId ? "/api/renewals/" + editingId : "/api/renewals", { method: editingId ? "PUT" : "POST", body: JSON.stringify(body) });
      $("#dlg").close();
      await load();
    } catch (err) { $("#err").textContent = err.message; }
  };
  load();
</script>
</body>
</html>
